<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4" opacity="0.4">
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
  </g>

  <g filter="url(#shadow)">
    <rect x="236" y="100" width="128" height="128" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <g transform="translate(268, 132)" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="60" height="52" rx="8" stroke="#3b82f6" fill="#eff6ff" fill-opacity="0.6"/>
    <circle cx="32" cy="32" r="14" stroke="#2563eb" stroke-dasharray="5,4"/>
    <circle cx="32" cy="32" r="5" fill="#2563eb"/>
    <circle cx="50" cy="16" r="2.5" fill="#10b981" stroke="#10b981"/>
    <line x1="18" y1="58" x2="18" y2="64" stroke="#64748b"/>
    <line x1="46" y1="58" x2="46" y2="64" stroke="#64748b"/>
  </g>

  <rect x="220" y="248" width="160" height="28" rx="14" fill="#1e293b"/>
  <text x="300" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">FACILITY ASSET</text>
  
  <text x="300" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Placeholder Equipment Image</text>
  <text x="300" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#94a3b8" text-anchor="middle">Upload custom photo or retain standard placeholder</text>
